    const modalOverlay = document.getElementById('modalOverlay');
    const modalHeader = document.getElementById('modalHeader');
    const modalBody = document.getElementById('modalBody');

    function openModal(type) {
        const data = modalData[type];
        if (!data) return;

        modalHeader.innerHTML = `
            <div class="w-7 h-7 rounded-lg bg-${data.color}-100 flex items-center justify-center">
                <iconify-icon icon="material-symbols:${data.icon}" class="text-${data.color}-600 text-base"></iconify-icon>
            </div>
            <h3 class="text-sm font-bold text-gray-800">${data.title}</h3>
        `;

        modalBody.innerHTML = data.content;
        modalOverlay.classList.remove('hidden');
    }

    function closeModal() {
        modalOverlay.classList.add('hidden');
    }

    window.openModal = openModal;
    window.closeModal = closeModal;
